services:
  - type: web
    name: basistha-backend
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: ENVIRONMENT
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DEFAULT_AYANAMSHA
        value: LAHIRI
      - key: DEFAULT_TIMEZONE_OFFSET
        value: 5.75
