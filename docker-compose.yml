version: '3.8'

services:
  # 1. PostgreSQL Database Service
  postgres:
    image: postgres:15-alpine
    container_name: basistha_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Biswash@#12
      POSTGRES_DB: basistha_astrology
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. FastAPI Backend Service (Swiss Ephemeris Engine)
  backend:
    build:
      context: ./basistha-backend
      dockerfile: Dockerfile
    container_name: basistha_backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ENVIRONMENT: production
      PORT: 8000
      DATABASE_URL: postgresql://postgres:Biswash%40%2312@postgres:5432/basistha_astrology
      PG_HOST: postgres
      PG_PORT: 5432
      PG_USER: postgres
      PG_PASSWORD: Biswash@#12
      PG_DBNAME: basistha_astrology
      ALLOWED_ORIGINS: "http://localhost:3000,http://frontend:3000"
      SECRET_KEY: basistha_production_secure_secret_key_2026
    ports:
      - "8000:8000"

  # 3. Next.js Frontend Service
  frontend:
    build:
      context: ./basistha-frontend
      dockerfile: Dockerfile
    container_name: basistha_frontend
    restart: always
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
    ports:
      - "3000:3000"

volumes:
  postgres_data:
